# Supply-chain policy for the Rust workspace (ISC-182).
#
# A single static binary that other people run is only as trustworthy as what
# it links. This file is the machine-checkable half of that claim: without it
# `cargo deny check licenses` rejects everything (empty default allow-list), so
# a green run would prove nothing.

[graph]
# Evaluate the graph for what v0.2 actually ships: macOS. This is NOT a way to
# duck findings — it stops the check from reporting crates that are never
# compiled. Concretely, RUSTSEC-2026-0192 (`ttf-parser` unmaintained) reaches
# the tree only through `sctk-adwaita` (winit's Wayland client-side
# decorations), which is Linux-only, and `ade-control-center` refuses to
# install off macOS. `cargo tree --target aarch64-apple-darwin -i ttf-parser`
# prints nothing, while `--target all` finds it.
#
# WHEN THE GUI PORTS TO LINUX OR WINDOWS: delete this section, re-run
# `cargo deny check advisories`, and deal with whatever it then finds honestly.
targets = [
  { triple = "aarch64-apple-darwin" },
  { triple = "x86_64-apple-darwin" },
]

[licenses]
# Permissive only. Copyleft is absent from the tree; where a crate offers a
# copyleft option alongside a permissive one (e.g. "MIT OR Apache-2.0 OR
# LGPL-2.1-or-later"), the permissive option is the one taken.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "Unlicense",
  "BSL-1.0",
  "CC0-1.0",
  "Unicode-3.0",
  # Bundled default fonts (egui/epaint) ship under font licences, which are
  # redistribution-friendly and do not reach the code we link.
  "OFL-1.1",
  "Ubuntu-font-1.0",
]
confidence-threshold = 0.9

[bans]
# Duplicate major versions are a smell, not a failure: the GUI stack pulls its
# own transitive graph. Surfaced, not fatal.
multiple-versions = "warn"
wildcards = "deny"

[advisories]
yanked = "deny"

[sources]
# Nothing may come from anywhere except crates.io — no git deps, no patched
# registries, which is the shape a supply-chain attack takes here.
unknown-registry = "deny"
unknown-git = "deny"

# ADEB: SLSA build provenance for release binaries via GitHub-native artifact
# attestations. NOT slsa-framework/slsa-github-generator — verified live this
# session that project is no longer actively maintained upstream, which now
# recommends this native path instead (sscsb, ADEB's sibling, still uses the
# older generator; that's a separate repo's decision, not ported here).
#
# Also ships a cosign keyless signature and a Scorecard-recognized provenance
# asset — verified directly against Scorecard's own probe source (checks/
# raw+evaluation/probes for Signed-Releases), not assumed from docs:
# releasesAreSigned only recognizes a release asset suffixed one of .asc/
# .minisig/.sig/.sign/.sigstore/.sigstore.json (scores 8/10 alone);
# releasesHaveProvenance only recognizes a release asset suffixed EXACTLY
# .intoto.jsonl (bumps to 10/10) — GitHub's native attestation API record
# alone satisfies neither probe, since both only look at release ASSET
# filenames, not the Attestations API. sscsb's own release currently scores
# 8/10 for exactly this reason (signed, no provenance ASSET attached).
name: Release — SLSA Provenance
on:
  release:
    types: [published]

permissions:
  contents: read

# No cancel-in-progress — a release build is integrity-critical; queue a
# second trigger rather than kill a run that's mid-attestation.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  build-and-attest:
    runs-on: macos-latest
    permissions:
      contents: write # attach binary + attestation to the release
      id-token: write # sign attestation (Sigstore Fulcio)
      attestations: write # publish the attestation
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # dtolnay/rust-toolchain: see ci.yml's comment on this pin.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable (2026-08-05)
      - name: Build release binary (aarch64-apple-darwin — deny.toml's only shipped target)
        run: |
          cargo build --release -p ade --locked --target aarch64-apple-darwin
          mkdir -p dist
          cp target/aarch64-apple-darwin/release/ade "dist/ade-${GITHUB_REF_NAME}-aarch64-apple-darwin"
      - name: Generate build provenance attestation
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/ade-${{ github.ref_name }}-aarch64-apple-darwin"
      # Scorecard's releasesHaveProvenance probe only recognizes a release
      # asset suffixed exactly .intoto.jsonl — the attestation already exists
      # in GitHub's Attestations API (proven below), this just also ships it
      # as a plain downloadable file so the probe (and anyone verifying
      # offline) can see it without calling the API.
      # The output reaches the shell through the ENVIRONMENT, never via ${{ }}
      # interpolation into the script body — an action output is untrusted
      # input from this workflow's own trust boundary, same rule sscsb's
      # release-slsa.yml already enforces on its provenance filename.
      - name: Copy attestation bundle as a Scorecard-recognized asset
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" "dist/ade-${GITHUB_REF_NAME}-aarch64-apple-darwin.intoto.jsonl"
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # Belt-and-suspenders vs. the attestation above: releasesAreSigned wants
      # its own recognized suffix (.sigstore.json here) independent of
      # provenance — matches sscsb's own proven release-sign.yml pattern.
      - name: Keyless sign the binary (cosign, Fulcio + Rekor)
        run: cosign sign-blob "dist/ade-${GITHUB_REF_NAME}-aarch64-apple-darwin" --bundle "dist/ade-${GITHUB_REF_NAME}-aarch64-apple-darwin.sigstore.json" --yes
      # gh CLI ships on the runner image already — one fewer third-party action
      # in the supply chain for a step `gh release upload` does natively.
      - name: Upload release assets (binary + provenance + signature)
        run: gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      # Prove both are real, not just "the step didn't error" — the same
      # verify-before-trust discipline as sscsb's release-slsa.yml.
      - name: Verify attestation against the built artifact
        run: |
          set -uo pipefail
          gh attestation verify "dist/ade-${GITHUB_REF_NAME}-aarch64-apple-darwin" \
            --repo "${GITHUB_REPOSITORY}"
        env:
          GH_TOKEN: ${{ github.token }}
      # Identity format verified live this session (not assumed from docs
      # alone): Fulcio embeds job_workflow_ref as the cert's SAN URI,
      # `https://github.com/{owner}/{repo}/.github/workflows/{file}@{ref}`;
      # for a `release: published` trigger the ref resolves to the TAG ref
      # (`refs/tags/<tag>`), not a commit SHA (GitHub's own docs on release-
      # event ref resolution). Anchored to this exact repo + workflow file;
      # only the tag varies release to release, deliberately, so this regex
      # verifies every future tagged release without editing it per-release.
      - name: Verify cosign signature against the built artifact
        run: |
          set -uo pipefail
          cosign verify-blob "dist/ade-${GITHUB_REF_NAME}-aarch64-apple-darwin" \
            --bundle "dist/ade-${GITHUB_REF_NAME}-aarch64-apple-darwin.sigstore.json" \
            --certificate-identity-regexp "^https://github\.com/${GITHUB_REPOSITORY}/\.github/workflows/release-slsa\.yml@refs/tags/.+$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

# ADEB: SLSA build provenance for release binaries via GitHub-native artifact
# attestations. NOT slsa-framework/slsa-github-generator — verified live this
# session that project is no longer actively maintained upstream, which now
# recommends this native path instead (sscsb, ADEB's sibling, still uses the
# older generator; that's a separate repo's decision, not ported here).
name: Release — SLSA Provenance
on:
  release:
    types: [published]

permissions:
  contents: read

# No cancel-in-progress — a release build is integrity-critical; queue a
# second trigger rather than kill a run that's mid-attestation.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  build-and-attest:
    runs-on: macos-latest
    permissions:
      contents: write # attach binary + attestation to the release
      id-token: write # sign attestation (Sigstore Fulcio)
      attestations: write # publish the attestation
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # dtolnay/rust-toolchain: see ci.yml's comment on this pin.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable (2026-08-05)
      - name: Build release binary (aarch64-apple-darwin — deny.toml's only shipped target)
        run: |
          cargo build --release -p ade --locked --target aarch64-apple-darwin
          mkdir -p dist
          cp target/aarch64-apple-darwin/release/ade "dist/ade-${GITHUB_REF_NAME}-aarch64-apple-darwin"
      - name: Generate build provenance attestation
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/ade-${{ github.ref_name }}-aarch64-apple-darwin"
      # gh CLI ships on the runner image already — one fewer third-party action
      # in the supply chain for a step `gh release upload` does natively.
      - name: Upload release asset
        run: gh release upload "${GITHUB_REF_NAME}" "dist/ade-${GITHUB_REF_NAME}-aarch64-apple-darwin"
        env:
          GH_TOKEN: ${{ github.token }}
      # Prove the attestation is real, not just "the step didn't error" — the
      # same verify-before-trust discipline as sscsb's release-slsa.yml.
      - name: Verify attestation against the built artifact
        run: |
          set -uo pipefail
          gh attestation verify "dist/ade-${GITHUB_REF_NAME}-aarch64-apple-darwin" \
            --repo "${GITHUB_REPOSITORY}"
        env:
          GH_TOKEN: ${{ github.token }}

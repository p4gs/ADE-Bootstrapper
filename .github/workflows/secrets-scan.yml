# ADEB: CI secret-scanning redundancy (TruffleHog + Gitleaks).
# The local .pre-commit-config.yaml hook (also TruffleHog) only protects commits
# made through a machine that has the hook installed; this catches anything
# that slips past — a web-UI commit, a bypassed local hook, a force-push.
name: Secret Scan
on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: "23 4 * * 1" # weekly full-history retro-scan (fetch-depth: 0 below)

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout (full history for diff scanning)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: TruffleHog scan
        uses: trufflesecurity/trufflehog@20652fbbdefffcdaa493a5bf57ab2ac6b1db715b # v3.97.1
        with:
          extra_args: --results=verified,unknown

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Organizations need a license; personal accounts do not:
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

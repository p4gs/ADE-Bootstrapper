# ADEB: CI secret scanning (TruffleHog only).
# Policy (sscsb .sscsb/config.toml [controls.secrets] gitleaks = false): TruffleHog
# is the single credential-detection engine for this repo. It is the stronger tool
# here -- it verifies candidate secrets against the issuing provider, so a finding
# is live-or-not rather than regex-shaped, and `--results=verified,unknown` keeps
# the unverifiable tail visible. Running a second regex engine alongside it adds
# duplicate findings and a second tuning surface, not coverage.
# The local .pre-commit-config.yaml hook (also TruffleHog) only protects commits
# made through a machine that has the hook installed; this catches anything
# that slips past — a web-UI commit, a bypassed local hook, a force-push.
name: Secret Scan
on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: "23 4 * * 1" # weekly full-history retro-scan (fetch-depth: 0 below)

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout (full history for diff scanning)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: TruffleHog scan
        uses: trufflesecurity/trufflehog@bcfcf73aaf4759d4dadc2783177c245a02792318 # v3.97.0
        with:
          extra_args: --results=verified,unknown


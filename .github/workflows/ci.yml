name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The Rust workspace is the product (ade-core + ade CLI + native apps).
  rust:
    runs-on: macos-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # dtolnay/rust-toolchain publishes no semver tags — `stable`/`beta`/`nightly`
      # branch heads move as new toolchains ship, by design. Pinned to the branch's
      # current commit rather than left as a floating ref. UNVERIFIED (Max's
      # second-look review, ISA Decisions 2026-08-22): whether Dependabot's
      # github-actions updater can bump a SHA pin with no semver release to
      # resolve against is not proven — if the first weekly Dependabot run
      # produces no bump PR for this pin, treat it as manual-refresh-only and
      # say so, don't keep asserting an unverified auto-bump.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable (2026-08-05)
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      - name: Install cargo-deny + cargo-llvm-cov
        uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2
        with:
          tool: cargo-deny,cargo-llvm-cov
      - name: Supply chain (licenses, advisories, sources, bans)
        run: cargo deny check
      - name: Coverage gate (95% line / 95% function)
        run: bash scripts/coverage-check.sh --summary-only

  # The TS tree is the executable specification (oracle) — it must stay green
  # until parity retirement is decided (ISC-180/200).
  oracle:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - name: Install dev dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Tests with coverage gate (95% line / 95% function)
        run: bun test --coverage

  # Cross-implementation differential: Rust output vs the TS oracle.
  parity:
    runs-on: macos-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable (2026-08-05)
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - name: Build ade
        run: cargo build -p ade --locked
      - name: Parity harness
        run: bash scripts/parity-check.sh target/debug/ade

# ADEB: OpenGrep SAST (default engine — Semgrep-compatible, open rules).
# No first-party OpenGrep action exists, so the pinned release binary is
# downloaded directly and its checksum verified before execution.
# `p/rust` + `p/typescript` + `p/security-audit` cover this repo's two
# languages plus general secure-coding patterns — no local .rules dir exists
# yet, unlike sscsb's `.sscsb/rules`, so the registry rulesets are the floor.
name: SAST (OpenGrep)
on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENGREP_VERSION: v1.25.0

jobs:
  opengrep:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cosign (verifies the OpenGrep release below)
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Install pinned OpenGrep and verify signature (cosign keyless)
        run: |
          curl -fsSL -o opengrep \
            "https://github.com/opengrep/opengrep/releases/download/${OPENGREP_VERSION}/opengrep_manylinux_x86"
          curl -fsSL -o opengrep.sig \
            "https://github.com/opengrep/opengrep/releases/download/${OPENGREP_VERSION}/opengrep_manylinux_x86.sig"
          curl -fsSL -o opengrep.cert \
            "https://github.com/opengrep/opengrep/releases/download/${OPENGREP_VERSION}/opengrep_manylinux_x86.cert"
          # Anchored + escaped: an unanchored substring match would also pass
          # a cert from any sibling repo whose identity CONTAINS this string
          # (e.g. opengrep/opengrep-rules) — a real trust-boundary widening,
          # not a style nit.
          cosign verify-blob opengrep \
            --signature opengrep.sig \
            --certificate opengrep.cert \
            --certificate-identity-regexp '^https://github\.com/opengrep/opengrep/' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          chmod +x opengrep && sudo mv opengrep /usr/local/bin/
      # target/, node_modules/, coverage/, and bundles/ are build output, not
      # source — scanning them wastes time and cannot find anything real.
      # --severity ERROR is not cosmetic: --error alone fails the job on ANY
      # finding (INFO/WARNING included) from three broad registry rulesets
      # this tree has never been scanned against before. --severity is a
      # FILTER, not a threshold (skill gotcha) — both flags are required for
      # "fail only on real severity" to actually be what this step does.
      - name: Run OpenGrep
        run: |
          opengrep scan --config p/rust --config p/typescript --config p/security-audit \
            --exclude target --exclude node_modules --exclude coverage --exclude bundles \
            --sarif-output=opengrep.sarif --severity ERROR --error .
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: opengrep.sarif

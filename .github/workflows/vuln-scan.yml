# ADEB: vulnerability scanning — Trivy (fs: vuln+secret+misconfig → SARIF)
# and OSV-Scanner V2 via Google's reusable workflow (lockfile-exact). Covers
# the TypeScript oracle's bun.lock, which cargo-deny cannot see.
name: Vulnerability Scan
on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # trivy-action's own default exit-code is 0 regardless of findings —
      # without exit-code:1 this step reports but never gates anything
      # (caught by Max's second-look review). SARIF still uploads either way.
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy.sarif
          exit-code: "1"
          severity: "HIGH,CRITICAL"
      # always(): the scan step above now exits 1 on HIGH/CRITICAL findings —
      # the SARIF still needs to land in code scanning on a failing run, not
      # just a clean one.
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: trivy.sarif

  # Google's recommended consumption of OSV-Scanner is this reusable workflow.
  # Reusable-workflow jobs carry their own steps; permissions below are what it documents.
  osv-scanner:
    permissions:
      actions: read # reusable-workflow context
      contents: read
      security-events: write # upload SARIF to code scanning
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
    with:
      scan-args: |-
        --recursive
        ./

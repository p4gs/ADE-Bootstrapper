[package]
name = "ade-control-center-dx"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "ADE Control Center — Dioxus contender for the GUI bake-off"

# A workspace of its own (excluded from the root `Cargo.toml`), so its
# dependency graph is scored on its own lockfile: `cargo deny check` run
# from this directory is the contender's supply-chain scorecard, and the
# shipping workspace's gates stay green regardless of what it pulls in.
[workspace]

[dependencies]
ade-core = { version = "0.2.0", path = "../ade-core" }
# Devtools and the logger are development conveniences, not something a
# shipped desktop app should carry; `lib` + `launch` is the core framework.
dioxus = { version = "0.7.10", default-features = false, features = ["lib", "launch"] }
# The Lucide icon map shipped beside the font is JSON. Already a workspace
# dependency and on the `.sscsb/policy/packages.toml` approved baseline.
serde_json = "1.0.151"

# Exactly one renderer per build. `webview` is Dioxus's own default for
# desktop (wry over the system WebView); `native` is the Blitz renderer with
# no webview at all. The bake-off runs the same source under both.
[features]
default = ["webview"]
webview = ["dioxus/desktop"]
native = ["dioxus/native"]

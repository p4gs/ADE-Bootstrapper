title = "ADE Bootstrapper gitleaks configuration"

[extend]
useDefault = true

# ade.lock.json is a content-addressed lockfile: `"<path>": "<sha256-of-that-file>"`.
# gitleaks' generic-api-key rule cannot distinguish a SHA256 content-integrity
# hash keyed by file path from a leaked credential — both are high-entropy hex
# strings paired with a key-like string. This is the documented, narrow
# exception: the scanner fundamentally cannot model "this hex string is a
# lockfile checksum, not a secret" (no rule variant targets that semantic).
# Scope is exactly one file, not a rule-wide disable — every other path in the
# tree still runs the full default ruleset including generic-api-key.
[[allowlists]]
description = "ade.lock.json: SHA256 content-hash lockfile entries, not credentials"
paths = ['''^ade\.lock\.json$''']
